name: Build APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: |
          npx cap sync

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          cd android/app/build/outputs/apk/debug
          mv app-debug.apk wintophone-qwertyos.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wintophone-qwertyos-apk
          path: android/app/build/outputs/apk/debug/wintophone-qwertyos.apk
          retention-days: 30

      - name: Upload to GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/wintophone-qwertyos.apk
          tag_name: v${{ github.run_number }}
          name: WintoPhone QwertyOS v${{ github.run_number }}
          body: |
            Автоматическая сборка APK
            - Версия: ${{ github.run_number }}
            - Имя файла: wintophone-qwertyos.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
